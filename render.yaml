# Render Blueprint sketch for StudyWise AI API (hybrid: Vercel frontend + this service).
# Does not deploy by itself — apply in the Render dashboard or via Render Blueprint
# after you set secret env vars. Never commit real credentials.
#
# Persistent disk: mount /var/data and set PDF_STORAGE_DIR / RAG_STORAGE_DIR accordingly.
# Without a disk, PDF uploads and RAG indexes are ephemeral and will be lost on redeploy.

services:
  - type: web
    name: studywise-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Single instance recommended until shared rate-limit + disk locking exist.
    numInstances: 1
    disk:
      name: studywise-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_NAME
        value: studyai
      - key: PDF_STORAGE_DIR
        value: /var/data/documents
      - key: RAG_STORAGE_DIR
        value: /var/data/rag
      # Set these as secrets in the Render dashboard (do not put values in git):
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
